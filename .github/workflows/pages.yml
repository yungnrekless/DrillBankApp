# Deploys docs/ to GitHub Pages.
#
# This replaces the built-in "deploy from a branch" path, whose deployment
# backend stalled repeatedly on this repo: the build succeeded in seconds,
# then the deploy step sat in deployment_in_progress until it hit its
# ten-minute timeout and cancelled itself. This workflow uploads the same
# docs/ folder as an artifact and deploys it through actions/deploy-pages,
# which does not use that backend.
#
# configure-pages runs with enablement: true so it can switch the repository
# from branch-based Pages to workflow-based on the first run, rather than
# needing the source changed by hand first.
#
# Every action here must be on a major version whose runtime is node24. GitHub
# deprecated Node 20 on 2025-09-19 and now force-runs node20 actions on node24,
# which works but is a warning today and a hard failure whenever the shim is
# withdrawn. Before bumping any of these, check `runs.using` in the action's
# own action.yml at the tag rather than assuming the newest release qualifies.
name: Deploy drills to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede any in-flight run so a newer commit always wins. A Pages deploy is
# atomic (deploy-pages swaps the whole site at once), so there is no
# half-finished state to protect — and cancel-in-progress:false previously let
# a run stuck in "waiting" hold the concurrency slot and block every later
# deploy indefinitely.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # v5 is the first release whose bundled actions/upload-artifact is v7.
      # The older v3 pinned upload-artifact@v4, which is what put the fourth
      # Node 20 entry in the deprecation annotation even though this workflow
      # never referenced upload-artifact directly.
      - name: Upload docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
